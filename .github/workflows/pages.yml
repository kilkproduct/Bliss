name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and verify the deployment origin.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight deploy finish so we never
# publish a half-finished artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css script.js stats.js 404.html _site/
          mkdir -p _site/assets
          cp assets/banner.jpg assets/pfp-small.png assets/favicon.png _site/assets/
          # Belt and braces: stop Pages from running Jekyll over the output.
          touch _site/.nojekyll
          echo "Staged files:"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
