<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — bliss</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<meta name="theme-color" content="#080a0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .not-found {
    min-height: calc(100vh - 64px);
    display: grid;
    align-items: center;
    padding: 64px 0;
  }
  .not-found-inner { max-width: 520px; }
  .not-found-code {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--text-3);
    margin-bottom: 24px;
  }
  .not-found h1 {
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }
  .not-found p {
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--text-2);
    margin-bottom: 30px;
  }
  .not-found-actions { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/Bliss/" aria-label="bliss home">
      <img src="assets/pfp-small.png" alt="" width="28" height="28" class="brand-mark">
      <span class="brand-name">bliss</span>
    </a>
    <div class="header-actions">
      <a class="link-quiet" href="/Bliss/#commands">Commands</a>
      <a class="btn btn-primary btn-sm" href="https://discord.com/oauth2/authorize?client_id=1551866139200585759&amp;permissions=8&amp;scope=bot%20applications.commands" target="_blank" rel="noopener">Add to Discord</a>
    </div>
  </div>
</header>

<main class="not-found">
  <div class="wrap">
    <div class="not-found-inner">
      <p class="not-found-code">ERROR 404 · CHANNEL NOT FOUND</p>
      <h1>This page was deleted, not sniped.</h1>
      <p>
        The link you followed doesn't exist — maybe a channel was renamed, or the URL lost a
        slash. Everything worth reading is one click away.
      </p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="/Bliss/">Back to the homepage</a>
        <a class="btn btn-secondary" href="https://blissbot.best/commands" target="_blank" rel="noopener">Command index</a>
      </div>
    </div>
  </div>
</main>

</body>
</html>
