<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — this page wandered off | bliss</title>
<link rel="icon" href="/Bliss/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 32px;
    text-align: center;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #eaf4ff;
    background:
      radial-gradient(90% 70% at 50% -10%, #0b2a5c 0%, #06122e 45%, #040a1c 100%),
      #040a1c;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(120, 180, 255, 0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(120, 180, 255, 0.055) 1px, transparent 1px);
    background-size: 68px 68px;
    mask-image: radial-gradient(120% 70% at 50% 0%, #000 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(120% 70% at 50% 0%, #000 20%, transparent 78%);
    pointer-events: none;
  }
  main { position: relative; max-width: 520px; }
  img.cat {
    width: 92px;
    height: 92px;
    border-radius: 26px;
    object-fit: cover;
    margin: 0 auto 26px;
    box-shadow: 0 0 0 1px rgba(150, 235, 255, 0.4), 0 24px 60px -14px rgba(80, 215, 255, 0.7);
  }
  .code {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9fd9f7;
    background: rgba(80, 180, 255, 0.08);
    border: 1px solid rgba(120, 210, 255, 0.22);
    border-radius: 999px;
    padding: 5px 13px;
    display: inline-block;
    margin-bottom: 20px;
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.1;
  }
  h1 span {
    background: linear-gradient(100deg, #b6f7ff, #6fe3ff 34%, #8b9dff 66%, #f3a8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 0 0 28px; color: #9db0cf; line-height: 1.7; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 26px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    color: #04121f;
    text-decoration: none;
    background: linear-gradient(180deg, #b7f6ff 0%, #67ddff 55%, #4cc4f2 100%);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 12px 34px -10px rgba(80, 210, 255, 0.8);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 18px 44px -10px rgba(80, 210, 255, 0.95); }
  small { display: block; margin-top: 26px; font-size: 0.72rem; color: #6d86a5; }
</style>
</head>
<body>
  <main>
    <img class="cat" src="/Bliss/assets/pfp-small.png" alt="bliss the cat">
    <span class="code">404</span>
    <h1>This page <span>wandered off</span>.</h1>
    <p>Bliss looked everywhere — the archives, the #off-topic channel, even the memory vault. It's not here. Let's get you back to somewhere with vibes.</p>
    <a class="btn" href="/Bliss/">Take me back home</a>
    <small>bliss · the AI companion your Discord server deserves</small>
  </main>
</body>
</html>
